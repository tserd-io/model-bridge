name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  checks:
    runs-on: ubuntu-24.04
    timeout-minutes: 10

    env:
      LLM_PROVIDER: fake
      LLM_FALLBACK_PROVIDER: ""
      OPENAI_API_KEY: ""
      PYTHONDONTWRITEBYTECODE: "1"

    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false

      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Install locked dependencies
        run: |
          python -m pip install --require-hashes \
            -r requirements-ci.lock
          python -m pip check

      - name: Lint
        run: python -m ruff check model_bridge tests --config .github/workflows/ruff.toml

      - name: Audit dependencies
        shell: bash
        run: |
          python -m venv "$RUNNER_TEMP/pip-audit"
          "$RUNNER_TEMP/pip-audit/bin/python" -m pip install pip-audit
          "$RUNNER_TEMP/pip-audit/bin/python" -m pip_audit \
            --require-hashes \
            --strict \
            -r requirements-ci.lock

      - name: Run isolated tests
        shell: bash
        run: |
          mkdir -p "$RUNNER_TEMP/model-bridge"
          export IDEMPOTENCY_DB_PATH="$RUNNER_TEMP/model-bridge/requests.sqlite3"

          python -m pytest tests \
            -o addopts= \
            -q \
            -p no:cacheprovider \
            --basetemp="$RUNNER_TEMP/model-bridge/pytest" \
            --disable-socket \
            --allow-unix-socket

      - name: Check Uvicorn startup
        run: python -m tests.check_startup
  docker-smoke:
    name: Docker build and startup
    runs-on: ubuntu-24.04
    timeout-minutes: 10

    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false

      - name: Build image
        run: docker build --tag model-bridge:ci .

      - name: Start container
        run: |
          docker run --detach \
            --name model-bridge-ci \
            --env LLM_PROVIDER=fake \
            --env LLM_FALLBACK_PROVIDER= \
            model-bridge:ci

      - name: Wait for container health
        shell: bash
        run: |
          for attempt in {1..60}; do
            state=$(docker inspect --format '{{.State.Status}}' model-bridge-ci)
            health=$(docker inspect --format '{{.State.Health.Status}}' model-bridge-ci)

            echo "Attempt ${attempt}: state=${state}, health=${health}"

            if [[ "$state" != "running" ]]; then
              echo "::error::Container stopped before becoming healthy."
              exit 1
            fi

            case "$health" in
              healthy)
                exit 0
                ;;
              unhealthy)
                echo "::error::Container health check failed."
                exit 1
                ;;
            esac

            sleep 2
          done

          echo "::error::Timed out waiting for container health."
          exit 1

      - name: Show container diagnostics
        if: failure()
        run: |
          docker logs model-bridge-ci || true
          docker inspect model-bridge-ci || true

      - name: Remove container
        if: always()
        run: docker rm --force model-bridge-ci || true
