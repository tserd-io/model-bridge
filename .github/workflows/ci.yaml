name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  checks:
    runs-on: ubuntu-24.04
    timeout-minutes: 10

    env:
      LLM_PROVIDER: fake
      LLM_FALLBACK_PROVIDER: ""
      OPENAI_API_KEY: ""
      PYTHONDONTWRITEBYTECODE: "1"

    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false

      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Install locked dependencies
        run: |
          python -m pip install --require-hashes \
            -r scripts/requirements-ci.lock
          python -m pip check

      - name: Lint
        run: python -m ruff check scripts --config .github/workflows/ruff.toml

      - name: Audit dependencies
        shell: bash
        run: |
          python -m venv "$RUNNER_TEMP/pip-audit"
          "$RUNNER_TEMP/pip-audit/bin/python" -m pip install pip-audit
          "$RUNNER_TEMP/pip-audit/bin/python" -m pip_audit \
            --require-hashes \
            --strict \
            -r scripts/requirements-ci.lock

      - name: Run isolated tests
        shell: bash
        run: |
          mkdir -p "$RUNNER_TEMP/model-bridge"
          export IDEMPOTENCY_DB_PATH="$RUNNER_TEMP/model-bridge/requests.sqlite3"

          python -m pytest scripts/tests \
            -o addopts= \
            -q \
            -p no:cacheprovider \
            --basetemp="$RUNNER_TEMP/model-bridge/pytest" \
            --disable-socket \
            --allow-unix-socket

      - name: Check Uvicorn startup
        run: python scripts/check_startup.py
